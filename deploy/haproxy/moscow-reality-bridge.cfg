global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  2m
    timeout server  2m

frontend reality_bridge
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl moscow_sni req.ssl_sni -i ru.arccnet.space
    acl estonia_sni req.ssl_sni -i ee.arccnet.space
    acl germany_sni req.ssl_sni -i de.arccnet.space
    use_backend moscow_reality if moscow_sni
    use_backend estonia_reality if estonia_sni
    use_backend germany_reality if germany_sni
    default_backend moscow_decoy

backend estonia_reality
    option tcp-check
    server estonia 87.251.19.197:443 check inter 5s fall 3 rise 2

backend germany_reality
    option tcp-check
    server germany 87.121.47.203:443 check inter 5s fall 3 rise 2

backend moscow_reality
    option tcp-check
    server moscow_node 127.0.0.1:10443 check inter 5s fall 3 rise 2

backend moscow_decoy
    server decoy 127.0.0.1:8444 check
