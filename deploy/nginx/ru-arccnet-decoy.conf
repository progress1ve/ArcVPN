map $request_method $arc_xhttp_method {
    default $request_method;
    OPTIONS POST;
}

upstream arc_xhttp_eu {
    server 87.121.47.203:80 max_fails=2 fail_timeout=10s;
    server 87.251.19.197:80 backup;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ru.arccnet.space _;

    location /api-test {
        proxy_method $arc_xhttp_method;
        proxy_pass http://arc_xhttp_eu;
        proxy_http_version 1.1;
        proxy_set_header Host cdn-de.arccnet.space;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 308 https://ru.arccnet.space$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl;
    server_name ru.arccnet.space;

    ssl_certificate /etc/letsencrypt/live/ru.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Russia-hosted public gateway. Application state remains authoritative
        # on the Poland control plane, while clients reach it through Moscow.
        proxy_pass https://217.60.33.38;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name arccnet.space;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host arccnet.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect https://arccnet.space/ https://ru.arccnet.space/;
        proxy_cookie_domain arccnet.space ru.arccnet.space;
    }
}
