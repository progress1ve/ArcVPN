server {
    listen 80;
    listen [::]:80;
    server_name nl.arccnet.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 308 https://nl.arccnet.space$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name nl.arccnet.space;
    ssl_certificate /etc/letsencrypt/live/nl.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nl.arccnet.space/privkey.pem;
    root /var/www/arcvpn-royale-site;
    index index.html;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
