server {
    listen 80;
    listen [::]:80;
    server_name de.arccnet.space;

    root /var/www/de.arccnet.space;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name de.arccnet.space;

    ssl_certificate /etc/letsencrypt/live/de.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/de.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DE_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/de.arccnet.space;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = / { try_files /index.html =404; }
    location = /robots.txt { try_files /robots.txt =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }
    location / { return 404; }
}
