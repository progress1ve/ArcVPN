# Only used as a destination inside observed VPN tunnels. No browsing logs.
server {
    listen 18080;
    listen 18443 ssl;
    ssl_certificate /etc/letsencrypt/live/sub.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.arccnet.space/privkey.pem;
    server_name sub.arccnet.space;
    access_log off;
    location = /generate_204 {
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location / { return 404; }
}
