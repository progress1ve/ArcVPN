<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Arc Network Status</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a0f; color: #dce7f5; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #263244; border-radius: 1rem; background: #0d131d; }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 5vw, 2.25rem); }
    p { margin: .5rem 0; color: #9fb0c4; line-height: 1.55; }
    .status { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1rem; color: #b9f6d2; }
    .status::before { content: ""; width: .65rem; height: .65rem; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 1rem #3ddc8466; }
  </style>
</head>
<body>
  <main>
    <h1>Arc Network</h1>
    <p>European network edge and availability endpoint.</p>
    <div class="status">Systems operational</div>
  </main>
</body>
</html>
