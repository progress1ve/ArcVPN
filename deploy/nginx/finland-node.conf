map $request_method $arc_fi_method { default $request_method; OPTIONS POST; }
server {
    listen 80;
    server_name fin.arccnet.space cdn-de.arccnet.space;
    root /var/www/html;
    index index.nginx-debian.html;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location /api-fin {
        proxy_method $arc_fi_method;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name fin.arccnet.space;
    ssl_certificate /etc/letsencrypt/live/fin.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fin.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/html;
    index index.nginx-debian.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
