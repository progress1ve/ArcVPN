server {
    listen 80;
    listen [::]:80;
    server_name ee.arccnet.space;

    root /var/www/ee-arccnet;
    index index.html;

    location = / { try_files /index.html =404; }
    location = /robots.txt { try_files /robots.txt =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }
    location / { return 404; }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name ee.arccnet.space;

    ssl_certificate /etc/letsencrypt/live/ee.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ee.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ee-arccnet;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = / { try_files /index.html =404; }
    location = /robots.txt { try_files /robots.txt =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }
    location / { return 404; }
}
