server {
    listen 80;
    listen [::]:80;
    server_name ee.arccnet.space;

    root /var/www/ee-arccnet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name ee.arccnet.space;

    ssl_certificate /etc/letsencrypt/live/ee.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ee.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ee-arccnet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
