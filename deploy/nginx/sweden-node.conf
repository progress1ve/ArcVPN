server {
    listen 80;
    server_name se.arccnet.space;
    root /var/www/html;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name se.arccnet.space;
    ssl_certificate /etc/letsencrypt/live/se.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/se.arccnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/html;
    index index.nginx-debian.html;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
}
