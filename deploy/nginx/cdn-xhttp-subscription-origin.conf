# Shared Yandex CDN origin for ArcVPN XHTTP and uncached subscription refresh.
map $request_method $arc_xhttp_method {
    default $request_method;
    OPTIONS POST;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cdn-de.arccnet.space cdn-nd.arccnet.space sub.arccnet.space _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location /api-test {
        proxy_method $arc_xhttp_method;
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keep stable user URLs while Yandex fronts subscription refresh. The
    # upstream is addressed by IP to avoid a DNS loop after sub.arccnet.space
    # becomes a CDN CNAME; TLS still verifies the public subscription hostname.
    location ^~ /sub/ {
        proxy_pass https://217.60.33.38;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name sub.arccnet.space;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host sub.arccnet.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
