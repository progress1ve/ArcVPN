# Dedicated partner surface; customer, subscription and admin endpoints are inaccessible here.
server {
    listen 80;
    server_name partners.arccnet.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen 2053 ssl http2;
    server_name partners.arccnet.space;
    ssl_certificate /etc/letsencrypt/live/partners.arccnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partners.arccnet.space/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 16k;
    location = / { return 302 /partner; }
    location = /partner {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /app/assets/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
    }
    location ^~ /api/partners/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
