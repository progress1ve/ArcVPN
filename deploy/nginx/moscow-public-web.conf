server {
    listen 80;
    server_name arccnet.space;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arc-guide-acme;
    }
    location / { return 308 https://arccnet.space$request_uri; }
}
server {
    listen 127.0.0.1:8444 ssl;
    server_name arccnet.space;
    ssl_certificate /etc/arcvpn-web-tls/fullchain.pem;
    ssl_certificate_key /etc/arcvpn-web-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/arcvpn-site/current;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = / {
        add_header Cache-Control "no-store";
        try_files /app/index.html =404;
    }
    location = /app {
        add_header Cache-Control "no-store";
        try_files /app/index.html =404;
    }
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /app/vendor/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }
    location / {
        proxy_pass https://217.60.33.38;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name sub.arccnet.space;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host arccnet.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
